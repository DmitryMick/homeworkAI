<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Expenses Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>Monthly Expenses Calculator</h1>
            <p class="subtitle">Track and analyze your monthly spending patterns</p>
        </header>
        
        <div class="expense-form">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" required>
                        <option value="">Select a category</option>
                        <option value="Groceries">Groceries</option>
                        <option value="Rent">Rent</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Communication">Communication</option>
                        <option value="Gym">Gym</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($):</label>
                    <input type="number" id="amount" required min="0" step="0.01" placeholder="Enter amount">
                </div>
                <button type="submit" class="primary-btn">Add Expense</button>
            </form>
        </div>

        <div class="expenses-list">
            <h2>Expenses List</h2>
            <div class="table-container">
                <table id="expensesTable">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Amount ($)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expensesTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="expense-analysis hidden">
            <h2>Expense Analysis</h2>
            <div id="analysisResults">
                <div class="result-item">
                    <h3>Total Expenses:</h3>
                    <p id="totalExpenses" class="highlight">$0.00</p>
                </div>
                <div class="result-item">
                    <h3>Average Daily Expense:</h3>
                    <p id="averageDaily" class="highlight">$0.00</p>
                </div>
                <div class="result-item">
                    <h3>Top 3 Expenses:</h3>
                    <ul id="topExpenses" class="top-expenses-list"></ul>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
