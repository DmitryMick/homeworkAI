# Test-specific configuration using TestContainers
spring.datasource.url=jdbc:tc:postgresql:16:///tests-db
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# JPA/Hibernate settings for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for tests (we'll use Hibernate DDL)
spring.flyway.enabled=false

# JWT settings for tests
jwt.secret=test-secret-key-for-testing-purposes-only-make-it-long-enough-for-hs256
jwt.expiration=86400000

# Logging for tests
logging.level.com.example.userstore=DEBUG
logging.level.org.springframework.security=DEBUG 